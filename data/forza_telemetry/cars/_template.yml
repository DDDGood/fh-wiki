# 車輛資料範本
# ────────────────────────────────────────────
# 複製此檔為 {ordinal}.yml（例：1564.yml）並填入。
# ordinal 從 session 資料夾名稱（car{N}_PI{N}）或 meta.json 的 car.ordinal 取得。
#
# 單位約定（檔案內不重複標註，遊戲內請統一設成這些）：
#   tire pressure : psi
#   spring rate   : kgf/mm
#   ride height   : cm
#   camber/toe    : 度
#   caster        : 度
#   aero          : 遊戲內顯示數值（kgf 或 lb，看遊戲設定）
#   brakes / diff : 百分比（不寫 % 符號）
#   ── specs 區塊 ──
#   power         : hp（遊戲設定走 imperial 顯示馬力）
#   weight        : kg
#   top_speed     : km/h
#   0-100         : 秒
#   lateral_g     : G（無單位）
#
# 為什麼保留 imperial：胎壓在 metric 模式會變 bar，比 ×14.5 換 psi 麻煩。
# 扭力故意省（推重比 hp/kg 已涵蓋動力訊號，FH5 imperial 顯示 kg·m 不直觀）。
#
# 調校歷史以 git 為準：改了 tune → 改檔 → commit。
# 各 session 的 meta.json 會凍結當時的快照，舊賽事不受未來 tune 改動影響。

# ── 元資料 ─────────────────────────────────
ordinal: 0000                  # ⚠ 改成實際 CarOrdinal
name: 車廠 車型 年份             # 例：Subaru BRZ 2013
manufacturer: 車廠
model_year: 2013
purpose: 軌跡                  # 軌跡 / 越野 / 漂移 / 通用
drivetrain: RWD                # AWD / RWD / FWD（僅標籤用，session 會以 UDP 為準）
class: A                       # X / S2 / S1 / A / B / C / D
notes: |
  自由文字。流派、改裝重點、駕駛感受、已知問題都寫這裡。

# ── 規格（從遊戲「車輛資料」頁複製）─────────
# 用於 race-analyst 開頭的「車輛規格基準」段落，例如：
#   推重比 X.XX kW/kg、極速上限 Y km/h、極限側向 Z G
# 不需要的欄位整行刪掉，不要留 0 或 null。
specs:
  top_speed_kmh: 297.8
  zero_to_100_s: 6.257
  power_hp: 625
  weight_kg: 1304
  lateral_g: 1.13

# ── 改裝（選填，純文字）─────────────────────
upgrades_notes: |
  引擎、變速、輪胎、減重級別等。要列就列，不要逼自己列全。
  懸吊系統 / 輪胎踏面 / 傳動系統 等改裝等級也寫這裡（不另設欄位）。

# ── 滑桿範圍（選填，因車而異那幾項）─────────
# 沒填 race-analyst 會用「小步幅度」建議；填了就能輸出「目前在範圍 38%」這種
# 精確診斷（彈簧、車高、空力的 FH5 滑桿端點各車差異極大）。
# 沒列在這裡的項目（damping / ARB / diff / brake / camber）多半通用範圍：
#   damping 1-20、ARB 1-65、diff 0-100、brake balance 0-100、camber -5 ~ 0
# 真踩到不通用的再加。
tune_ranges:
  springs:
    front: [80, 265]                 # kgf/mm，遊戲 tune 頁面看滑桿端點
    rear:  [80, 265]
    ride_height_front: [11.0, 14.0]  # cm
    ride_height_rear:  [11.0, 14.0]
  aero:
    rear:  [0, 200]                  # 沒前空力就只填 rear

# ── 目前調校（單一物件，非陣列）──────────────
# 用不到的欄位（例如 RWD 沒前差速器）整段刪掉，不要留 null。
tune:
  tires:
    pressure_front: 22.0
    pressure_rear: 22.0

  gearing:
    final_drive: 3.42
    ratios: [3.10, 2.20, 1.65, 1.30, 1.05, 0.85]

  alignment:
    camber_front: -2.4
    camber_rear: -1.5
    toe_front: 0.0
    toe_rear: 0.1
    caster: 6.0

  anti_roll_bars:
    front: 1                   # 1 = 最軟
    rear: 25

  springs:
    front: 720
    rear: 680
    ride_height_front: 11.0
    ride_height_rear: 11.5

  damping:
    rebound_front: 9.5
    rebound_rear: 8.0
    bump_front: 4.5
    bump_rear: 4.0

  # 沒可調空力套件就刪掉整個 aero 區塊
  aero:
    front: 80
    rear: 180

  brakes:
    balance: 52
    pressure: 100

  # 用不到的差速器欄位（例如 RWD 的 accel_front / decel_front / center）整個刪掉
  differential:
    accel_rear: 65
    decel_rear: 20
