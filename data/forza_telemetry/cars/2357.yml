# 車輛資料範本
# ────────────────────────────────────────────
# 複製此檔為 {ordinal}.yml（例：1564.yml）並填入。
# ordinal 從 session 資料夾名稱（car{N}_PI{N}）或 meta.json 的 car.ordinal 取得。
#
# 單位約定（檔案內不重複標註，遊戲內請設為這些單位）：
#   tire pressure : psi
#   spring rate   : kgf/mm
#   ride height   : cm
#   camber/toe    : 度
#   caster        : 度
#   aero          : 遊戲內顯示數值（kgf 或 lb，看遊戲設定）
#   brakes / diff : 百分比（不寫 % 符號）
#
# 調校歷史以 git 為準：改了 tune → 改檔 → commit。
# 各 session 的 meta.json 會凍結當時的快照，舊賽事不受未來 tune 改動影響。

# ── 元資料 ─────────────────────────────────
ordinal: 2357                  # ⚠ 改成實際 CarOrdinal
name: Ford Focus RS 2017             # 例：Subaru BRZ 2013
manufacturer: Ford
model_year: 2017
purpose: 公路                  # 軌跡 / 越野 / 漂移 / 通用
drivetrain: AWD                # AWD / RWD / FWD（僅標籤用，session 會以 UDP 為準）
class: A                       # X / S2 / S1 / A / B / C / D
notes: |
  追求馬力，犧牲一些操控。稍微容易打滑。

# ── 規格（從遊戲「車輛資料」頁複製）─────────
# 用於 race-analyst 開頭的「車輛規格基準」段落，例如：
#   推重比 X.XX hp/kg、極速上限 Y km/h、極限側向 Z G
# 不需要的欄位整行刪掉，不要留 0 或 null。
specs:
  top_speed_kmh: 297.8
  zero_to_100_s: 6.345
  power_hp: 625
  weight_kg: 1329
  lateral_g: 1.13

# ── 改裝（選填，純文字）─────────────────────
upgrades_notes: |
  引擎、變速、輪胎、減重級別等。要列就列，不要逼自己列全。

# ── 滑桿範圍（從遊戲 tune 頁面看）─────────────
# 你確認過彈簧上限是 265。其他端點待你下次進 tune 頁面順手抄。
# 範圍寫了 race-analyst 才能輸出「目前在 38% 位置 → 偏軟那端」這類診斷。
tune_ranges:
  springs:
    front: [54.2, 265]                 # ⚠ 下限 80 是猜的，下次進遊戲確認
    rear:  [54.2, 265]
    # ride_height_front / rear 也建議補一下端點
  # 沒前空力，rear 的範圍待補
  # aero:
  #   rear: [0, ?]

# ── 目前調校（單一物件，非陣列）──────────────
# 用不到的欄位（例如 RWD 沒前差速器）整段刪掉，不要留 null。
tune:
  tires:
    pressure_front: 26.0
    pressure_rear: 26.0

  gearing:
    final_drive: 3.72

  alignment:
    camber_front: -2.0
    camber_rear: -1.5
    toe_front: 0.0
    toe_rear: 0.0
    caster: 7.0

  anti_roll_bars:
    front: 1                   # 1 = 最軟
    rear: 60

  springs:
    front: 100
    rear: 125
    ride_height_front: 12.1
    ride_height_rear: 12

  damping:
    rebound_front: 12.0
    rebound_rear: 10.0
    bump_front: 8.0
    bump_rear: 6.0

  # 沒可調空力套件就刪掉整個 aero 區塊
  aero:
    rear: 185

  # 用不到的差速器欄位（例如 RWD 的 accel_front / decel_front / center）整個刪掉
  differential:
    accel_front: 90
    decel_front: 0
    accel_rear: 90
    decel_rear: 15
    center: 70
